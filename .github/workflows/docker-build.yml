name: Build and Push Docker Image

# 触发策略：
#   仅推送版本标签 vX.Y.Z 时构建并推送镜像，并校验标签与项目版本号一致。
#   main/master 分支推送不构建容器，避免日常提交消耗构建资源。
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: dnsmgr-pro
  # 标签发布固定只构建 amd64，避免 arm64 QEMU 模拟导致的长时间构建
  RELEASE_PLATFORMS: linux/amd64

# 同一 ref 只保留最新一次构建，避免排队堆积
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 解析项目版本号（= 关于页展示的版本号，来自 frontend/backend 的 package.json）
      - name: Resolve project version
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./backend/package.json').version")"
          FE_VERSION="$(node -p "require('./frontend/package.json').version")"
          if [[ "${PKG_VERSION}" != "${FE_VERSION}" ]]; then
            echo "::error::前后端版本号不一致（backend=${PKG_VERSION}, frontend=${FE_VERSION}），请使用 scripts/release.mjs 统一发布"
            exit 1
          fi
          if [[ ! "${PKG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须为 x.y.z 纯数字格式（当前：${PKG_VERSION}）"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "项目版本号：${PKG_VERSION}"

      # 仅版本标签会进入构建；同时校验标签与项目版本号一致，防止误发错版本
      - name: Validate release tag
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::当前不是版本标签，跳过镜像构建"
            exit 0
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 不是 x.y.z 版本号，拒绝构建"
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与项目版本号 ${VERSION} 不一致，请使用 scripts/release.mjs 发布"
            exit 1
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "原因：推送了版本标签 ${GITHUB_REF_NAME}，构建正式镜像"

      - name: Resolve build platforms
        id: platforms
        if: steps.gate.outputs.build == 'true'
        run: echo "platforms=${RELEASE_PLATFORMS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号与关于页一致；同时产出主/次版本与 latest 便于滚动升级
      - name: Docker metadata
        id: meta
        if: steps.gate.outputs.build == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push to Docker Hub & GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ steps.platforms.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 只读缓存，避免 mode=max 缓存导出在并发时拖慢/挂住构建
          cache-from: type=gha
          provenance: false

