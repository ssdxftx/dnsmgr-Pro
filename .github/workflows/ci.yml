name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  sqlite-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund

      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit

      - name: SQLite smoke test
        run: cd backend && npm run check:sqlite

      - name: Backup self-check
        run: cd backend && npm run check:backup

      - name: Audit coverage check
        run: cd backend && npm run check:audit

      - name: Setup Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Typecheck frontend
        run: cd frontend && npx vue-tsc --noEmit

      - name: Check i18n
        run: cd frontend && npm run check:i18n

      - name: Build frontend
        run: cd frontend && npm run build

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dnsmgr_ci
          MYSQL_USER: dnsmgr
          MYSQL_PASSWORD: dnsmgr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci --no-audit --no-fund

      - name: MySQL smoke test
        run: cd backend && npm run check:mysql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: dnsmgr
          DB_PASSWORD: dnsmgr
          DB_NAME: dnsmgr_ci
          DNSMGR_REQUIRE_MYSQL: '1'

      - name: Cross-engine backup test
        run: cd backend && npm run check:cross
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: dnsmgr
          DB_PASSWORD: dnsmgr
          DB_NAME: dnsmgr_ci
          DNSMGR_REQUIRE_MYSQL: '1'
