apiVersion: v1
kind: Namespace
metadata:
  name: dnsmgr-pro
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnsmgr-pro-data
  namespace: dnsmgr-pro
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmgr-pro
  namespace: dnsmgr-pro
  labels:
    app: dnsmgr-pro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnsmgr-pro
  template:
    metadata:
      labels:
        app: dnsmgr-pro
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dnsmgr-pro
          # 生产环境建议固定到版本标签或镜像 digest（升级前可先用 cosign verify 校验签名）：
          #   image: ssdxftx/dnsmgr-pro@sha256:<digest>
          image: ssdxftx/dnsmgr-pro:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: DNSMGR_DATA_DIR
              value: /app/data
            # 已挂载 PVC 时安装页默认 SQLite；也可在安装页切换为 MySQL。
            # 如需预置数据库连接，可取消注释（首次打开安装页填写更直观）
            # - name: DB_TYPE
            #   value: sqlite
            # - name: DB_FILE
            #   value: dnsmgr.sqlite
            # - name: DNSMGR_DATA_PERSISTENT
            #   value: "1"
            # - name: DB_HOST
            #   value: your-mysql-host
            # - name: DB_PORT
            #   value: "3306"
            # - name: DB_USER
            #   value: dnsmgr
            # - name: DB_PASSWORD
            #   value: your-password
            # - name: DB_NAME
            #   value: dnsmgr
            # - name: DB_PREFIX
            #   value: dnsmgr_
          resources:
            requests:
              cpu: 100m
              # 编译前基线空闲 RSS 约 135MiB，128Mi 会低于实际需求
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8082
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dnsmgr-pro-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dnsmgr-pro
  namespace: dnsmgr-pro
spec:
  type: ClusterIP
  selector:
    app: dnsmgr-pro
  ports:
    - port: 8082
      targetPort: 8082
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dnsmgr-pro
  namespace: dnsmgr-pro
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # 强制 HTTPS：会话令牌与备份上传都走明文 HTTP 会被链路嗅探
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    # 需事先创建 TLS Secret（cert-manager 或手工导入）：
    #   kubectl -n dnsmgr-pro create secret tls dnsmgr-pro-tls --cert=fullchain.pem --key=privkey.pem
    - hosts:
        - dns.example.com
      secretName: dnsmgr-pro-tls
  rules:
    - host: dns.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dnsmgr-pro
                port:
                  number: 8082---
# 默认拒绝全部入站/出站，再按需放行：
# 入站只允许 Ingress 控制器访问 8082；出站只允许 DNS 与 HTTPS（云厂商 API、Webhook、备份目的地）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dnsmgr-pro-default-deny
  namespace: dnsmgr-pro
spec:
  podSelector:
    matchLabels:
      app: dnsmgr-pro
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dnsmgr-pro-allow
  namespace: dnsmgr-pro
spec:
  podSelector:
    matchLabels:
      app: dnsmgr-pro
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
